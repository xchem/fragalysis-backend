server {
    client_max_body_size 0;
    listen 80;
    server_name ~^(.+)$;

    # L2 - Test
    include frag_proxy_params;
    proxy_redirect off;

    location = /favicon.ico { access_log off; log_not_found off; }
    location /static/ {
        root /code;

        # Moorhen starts Web Workers from static scripts (e.g. CootWorker.js).
        # The page is cross-origin isolated, so each worker script needs
        # its own COEP header or the browser blocks it.
        # Django adds this header to everything else (fragalysis/middleware.py).
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # An add_header here replaces (rather than extends) those in nginx.conf,
        # so they must be repeated. Keep these in step with nginx.conf.
        add_header Access-Control-Allow-Origin '*';
        add_header Access-Control-Allow-Credentials 'true';
        add_header Access-Control-Allow-Methods 'GET, PUT, POST, DELETE, PATCH, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
    }
    location /pdbs/ {
        alias /code/media/pdbs/;
        internal;
    }
    location /bound/ {
        alias /code/media/bound/;
        internal;
    }
    location /mtzs/ {
        alias /code/media/mtzs/;
        internal;
    }
    location /maps/ {
        alias /code/media/maps/;
        internal;
    }
    location /computed_set_data/ {
        alias /code/media/computed_set_data/;
        internal;
    }
    location /metadata/ {
        alias /code/media/metadata/;
        internal;
    }
    location /targets/ {
        alias /code/media/targets/;
        internal;
    }
    location /target_loader_data/ {
        alias /code/media/target_loader_data/;
        internal;
    }
    location / {
        proxy_pass http://unix:/code/django_app.sock;
        uwsgi_read_timeout 1000s;
    }
}
