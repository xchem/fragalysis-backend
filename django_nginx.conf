server {
    client_max_body_size 0;
    listen 80;
    server_name ~^(.+)$;

    # L2 - Test
    include frag_proxy_params;
    proxy_redirect off;

    # The DNS server that nginx uses to find the S3 host (see /media-s3/).
    # launch-stack.sh writes this file.
    include frag_resolver.conf;

    location = /favicon.ico { access_log off; log_not_found off; }
    location /static/ {
        root /code;

        # Moorhen starts Web Workers from static scripts (e.g. CootWorker.js).
        # The page is cross-origin isolated, so each worker script needs
        # its own COEP header or the browser blocks it.
        # Django adds this header to everything else (fragalysis/middleware.py).
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # An add_header here replaces (rather than extends) those in nginx.conf,
        # so they must be repeated. Keep these in step with nginx.conf.
        add_header Access-Control-Allow-Origin '*';
        add_header Access-Control-Allow-Credentials 'true';
        add_header Access-Control-Allow-Methods 'GET, PUT, POST, DELETE, PATCH, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
    }
    # Media files (issue 1038).
    # Django checks that the user can see a file, then replies with an
    # X-Accel-Redirect to one of these internal locations
    # (see viewer/media_storage.py). The browser cannot request them directly.

    # FILESYSTEM media storage: the file is under MEDIA_ROOT.
    location /media-local/ {
        internal;
        alias /code/media/;
    }

    # S3 media storage: nginx gets the file from the presigned URL that Django
    # puts in the X-Media-Url header. The browser does not see that URL.
    location /media-s3/ {
        internal;
        # Read the header now - the variable changes when the proxy starts.
        set $media_url $upstream_http_x_media_url;
        proxy_pass $media_url;
        proxy_http_version 1.1;

        # Send nothing from the browser except the Range headers.
        # Other headers (i.e. Authorization or a Cookie) can break the signature.
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        # nginx follows X-Accel-Redirect with a GET, also for a POST
        # (i.e. /api/download_target_experiments/), but it would still send the
        # POST's Content-Length (with no body) and S3 would wait for the body.
        proxy_set_header Content-Length "";
        proxy_set_header Host $proxy_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Verify the S3 server's certificate.
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        # Send the file to the browser as it arrives,
        # not through a temporary file on the Pod's disk.
        proxy_buffering off;
        proxy_max_temp_file_size 0;

        # Keep Django's Content-Type, and do not show S3 details to the browser.
        proxy_hide_header Content-Type;
        proxy_hide_header Set-Cookie;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-rgw-object-type;

        # S3 replies 403 (not 404) for a missing object or an expired URL.
        # The browser gets a plain 404, not the S3 error document.
        proxy_intercept_errors on;
        error_page 403 404 =404 @media_not_found;
    }
    location @media_not_found {
        return 404;
    }

    location / {
        proxy_pass http://unix:/code/django_app.sock;
        # Only nginx uses this header (see /media-s3/).
        proxy_hide_header X-Media-Url;
        uwsgi_read_timeout 1000s;
    }
}
