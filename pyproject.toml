[tool.poetry]
name = "fragalysis-backend"
version = "2.0.0"
description = "The backend for the Fragalysis Stack web application."
authors = ["Rachael Skyner <rachael.skyner@diamond.ac.uk>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "fragalysis_backend"}]

[tool.poetry.dependencies]
python = "^3.13.0"
django = "^5.2"
apscheduler = "^3.10"
celery = "^5.5"
django-bootstrap3 = "^25.2"
django-cleanup = "^8.1"
django-extensions = "^4.1"
django-filter = "^25.2"
django-guardian = "^3.2"
django-simple-history = "^3.10"
xchem-fragutils = "^2.0.0"
gunicorn = "^23.0"
humanize = "^4.15"
mozilla_django_oidc = "^4.0"
openpyxl = "^3.1"
pandas = "^2.3"
pandoc = "^2.3"
psycopg = { version = "^3.2", extras = ["binary", "pool"] }
redis = "^7.0"
shortuuid = "^1.0"
sshtunnel = "^0.4"
urllib3 = "^2.5"
validators = "^0.35"
django-celery-beat = "^2.8"
django-celery-results = "^2.6"
numpy = "^2.3"
python-dateutil = "^2"
pgvector = "^0.4"
setuptools = "^80.9.0"
bcrypt = "^5.0"
djangorestframework = "^3.16.1"
legacy-cgi = "^2.6.3"   # required by djangorestframwork
django-prometheus = "^2.4"
python-ipware = "^3.0.0"


# Specific (critical dependency) packages...
# Do not change these without careful thought!
rdkit = "2025.03.6"
xchem-db = "0.1.26b0"
im-squonk2-client = "^1.22.2"
django-webpack-loader = "^0.7.0"   # v3.2 fails to load


# unused/to be deprecated
# deepdiff = "^6.2.0"
graphene-django = "^3.1.3"
# mysql-connector-python = "^8.1.0"
# pymysql = "^1.1"   # where is mysql used?
# psutil = "^5.9.5"
pydiscourse = "^1.3.0"
# django-rest-swagger = "^2.2.0"



[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3"
pylint = "^3.0"  # held back by pylint-django
pylint-django = "^2.6"
httpie = "^3.2"
black = "^25.9"
mypy = "^1.18"

# Test framework - the unit tests run with pytest in a host/CI Poetry
# virtualenv (see run-unit-tests.sh), not inside the backend image. Install
# with 'poetry install --only main,test'.
[tool.poetry.group.test.dependencies]
pytest = "^8.3"
pytest-django = "^4.9"
pytest-cov = "^6.0"
pytest-mock = "^3.14"

# Documentation (Sphinx) - used by the 'build docs' GitHub Action.
# Note: building the docs also requires the 'main' dependencies, as
# conf.py runs django.setup() and autodoc imports the viewer app.
[tool.poetry.group.docs.dependencies]
sphinx = "^9.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.test_settings"
python_files = ["test_*.py"]
testpaths = ["viewer/tests"]
# --reuse-db: the viewer app has ~176 migrations, so creating the test
#   database from scratch on every run is slow. Reuse it between runs and
#   pass --create-db explicitly when migrations change. CI containers are
#   ephemeral so the first (and only) run always creates it.
# --strict-markers: typo'd/unknown @pytest.mark markers become errors.
# -m "not integration": the async integration test needs the live container
#   stack (redis + celery worker) and is never collected by the default/host
#   run; the integration compose runs it explicitly with -m integration.
addopts = "--reuse-db --strict-markers -m \"not integration\" --cov=viewer --cov-report=term-missing --cov-report=html"
markers = [
    "integration: needs the live container stack (redis + celery worker)",
]

[tool.coverage.run]
# Coverage measures the viewer app's hand-written code. Auto-generated
# migrations (excluded from all lint hooks too) and the tests themselves
# would otherwise distort the headline figure.
omit = [
    "viewer/migrations/*",
    "viewer/tests/*",
]

[tool.coverage.html]
directory = "htmlcov"
