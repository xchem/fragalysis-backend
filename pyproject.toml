[tool.poetry]
name = "fragalysis-backend"
version = "2.0.0"
description = "The backend for the Fragalysis Stack web application."
authors = ["Rachael Skyner <rachael.skyner@diamond.ac.uk>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "fragalysis_backend"}]

[tool.poetry.dependencies]
python = "^3.13.7"
django = "^5.2"
celery = "^5.5"
django-bootstrap3 = "^23.6"
django-cleanup = "^8.1"
django-extensions = "^4.1"
django-filter = "^25.2"
django-guardian = "^3.2"
django-simple-history = "^3.10"
django-webpack-loader = "^0.7.0"   # problem with that one
# django-webpack-loader = "^3.2"
django-rest-swagger = "^2.2.0"  # this version is for django3, is it even used?
fragalysis = "^1.1.0"
gunicorn = "^23.0"
im-squonk2-client = "^1.22.2"   # there's version 6.1?
# mozilla_django_oidc = "^3.0.0"
mozilla_django_oidc = "^4.0"
openpyxl = "^3.1"
pandas = "^2.3"
pandoc = "^2.3"
# psycopg2-binary = "^2.9.6"
psycopg = { version = "^3.2", extras = ["binary", "pool"] }
pymysql = "^1.1"   # where is mysql used?
redis = "^7.0"
sentry-sdk = "^1.29.2" # ?
shortuuid = "^1.0"
sshtunnel = "^0.4"
urllib3 = "^2.5"
validators = "^0.35"
django-celery-beat = "^2.8"
django-celery-results = "^2.6"
numpy = "^2.3"
python-dateutil = "^2"
pgvector = "^0.4"
setuptools = "^80.9.0"
legacy-cgi = "^2.6.3"   # required by djangorestframwork

# seem to be unused
deepdiff = "^6.2.0"
graphene-django = "^3.1.3"
mysql-connector-python = "^8.1.0"
psutil = "^5.9.5"
pydiscourse = "^1.3.0" # going to be dropped?


# Specific (critical dependency) packages...
# Do not change these without careful thought!
rdkit = "2025.03.6"
xchem-db = "0.1.26b0"
djangorestframework = "3.16.1"

bcrypt = "4.0.1"
# Django will (probably) need work in the code to support v4.
# Simply changing to django 4 results in errors
# like "CSRF Failed: Origin checking failed"
# Attempt to avoid the error:
# 'django_prometheus.db.backends.postgresql' isn't an available database backend
# Recent prometheus versions may break the build
django-prometheus = "2.3.1"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3"
pylint = "^3.0"  # held back by pylint-django
pylint-django = "^2.6"
httpie = "^3.2"
black = "^25.9"
mypy = "^1.18"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
