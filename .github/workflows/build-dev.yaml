---
name: build dev

# Actions that take place after every commit to 'dev' branches
# Anything that's not staging or production.
#
# If a DOCKERHUB_USERNAME secret is defined the image is pushed.

# ---------------
# Control secrets
# ---------------
#
# At the GitHub 'organisation' or 'project' level you are expected to
# have the following GitHub 'Repository Secrets' defined
# (i.e. via 'Settings -> Secrets'): -
#
# BE_NAMESPACE            optional - default xchem
#
# DOCKERHUB_USERNAME      optional
# DOCKERHUB_TOKEN         optional - required if DOCKERHUB_USERNAME
#
# -----------
# Environment (GitHub Environments)
# -----------
#
# (none)

on:
  push:
    branches-ignore:
    - 'staging'
    - 'production'
    tags-ignore:
    - '**'

env:
  # The following 'defaults' are used in the 'Initialise workflow variables' step,
  # which creates 'outputs' for use in steps and jobs that follow it.
  # The values set here are used unless a matching secret is found.
  # Secrets are the way users dynamically control the behaviour of this Action.
  #
  #   For Jobs conditional on the presence of a secret see this Gist...
  #   https://gist.github.com/jonico/24ffebee6d2fa2e679389fac8aef50a3
  BE_NAMESPACE: xchem
  # External (public-read S3) test data for the API upload tests (issue #964).
  # The bucket is anonymous-read, so no credentials are needed.
  UNIT_TEST_BUCKET_AND_PATH: s3://im-fragalysis-backend/unit-test
  UNIT_TEST_DATA_IDENTIFIER: ALPHA

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.vars.outputs.push }}
      be_namespace: ${{ steps.vars.outputs.BE_NAMESPACE }}
      tag: ${{ steps.vars.outputs.tag }}
      unit_test_bucket_and_path: ${{ steps.vars.outputs.unit_test_bucket_and_path }}
      unit_test_data_identifier: ${{ steps.vars.outputs.unit_test_data_identifier }}
    services:
      # PostgreSQL (pgvector) for the unit tests. pytest connects on
      # localhost:5432 - see tests/test_settings.py for the connection defaults.
      database:
        image: xchem/fragalysis-database:2026.04.1
        env:
          POSTGRES_PASSWORD: fragalysis
          POSTGRES_DB: frag
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Inject slug/short variables
      uses: rlespinasse/github-slug-action@v5
    - name: Initialise workflow variables
      id: vars
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        TRIGGER_DOWNSTREAM: ${{ secrets.TRIGGER_DOWNSTREAM }}
      run: |
        # BE_NAMESPACE
        BE_NAMESPACE="${{ env.BE_NAMESPACE }}"
        if [ -n "${{ secrets.BE_NAMESPACE }}" ]; then BE_NAMESPACE="${{ secrets.BE_NAMESPACE }}"; fi
        echo BE_NAMESPACE=${BE_NAMESPACE}
        echo "BE_NAMESPACE=${BE_NAMESPACE}" >> $GITHUB_OUTPUT

        # Do we push, i.e. is DOCKERHUB_USERNAME defined?
        echo push=${{ env.DOCKERHUB_USERNAME != '' }}
        echo "push=${{ env.DOCKERHUB_USERNAME != '' }}" >> $GITHUB_OUTPUT

        # The image tag (the branch/ref slug) and the external test-data vars,
        # surfaced as outputs for the downstream integration-tests job.
        echo "tag=${{ env.GITHUB_REF_SLUG }}" >> $GITHUB_OUTPUT
        echo "unit_test_bucket_and_path=${{ env.UNIT_TEST_BUCKET_AND_PATH }}" >> $GITHUB_OUTPUT
        echo "unit_test_data_identifier=${{ env.UNIT_TEST_DATA_IDENTIFIER }}" >> $GITHUB_OUTPUT
    - name: Checkout
      uses: actions/checkout@v6
    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.3.0
      with:
        dockerfile: Dockerfile
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Run pre-commit (all files)
      run: |
        pip install --requirement build-requirements.txt
        pre-commit run --all-files
    - name: Set up Python (unit tests)
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install Poetry
      run: pipx install poetry==2.1.4
    - name: Install test dependencies
      run: poetry install --only main,test --no-root --no-directory
    - name: Install pigz
      # The target loader shells out to 'tar -I pigz', so the eager upload
      # smoke test (issue #964) needs pigz on the runner.
      run: sudo apt-get update && sudo apt-get install -y pigz
    - name: Unit tests (pytest)
      # Runs on the host runner against the 'database' service container; the
      # backend image is not needed. DB connection defaults live in
      # tests/test_settings.py. The workflow-level UNIT_TEST_* env enables the
      # eager upload smoke test (issue #964), which downloads its archive from
      # the public-read S3 bucket.
      run: poetry run pytest
    - name: Docker build
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: ${{ steps.vars.outputs.BE_NAMESPACE }}/fragalysis-backend:${{ env.GITHUB_REF_SLUG }}
    - name: Display
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: ${{ steps.vars.outputs.BE_NAMESPACE }}/fragalysis-backend:${{ env.GITHUB_REF_SLUG }}
    - name: Vulnerability Scan (OSV)
      # The vulnerability scan (using Google's OSV)
      # Allowed to fail (we force true) as it's used for information only
      # The generated "Common Vulnerability Scoring System (CVSS)"" values
      # are interpreted as...
      #
      # - None: 0.0 (No impact)
      # - Low: 0.1–3.9 (Minor risk)
      # - Medium: 4.0–6.9 (Moderate risk)
      # - High: 7.0–8.9 (Serious risk)
      # - Critical: 9.0–10.0 (Grave, severe risk)
      run: |
        wget https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -O osv-scanner
        chmod +x osv-scanner
        ./osv-scanner scan image ${{ steps.vars.outputs.BE_NAMESPACE }}/fragalysis-backend:${{ env.GITHUB_REF_SLUG }} \
            --format markdown --output scan.md || true
        cat scan.md >> $GITHUB_STEP_SUMMARY
    - name: Login to DockerHub
      if: steps.vars.outputs.push == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Push
      if: steps.vars.outputs.push == 'true'
      run: docker push ${{ steps.vars.outputs.BE_NAMESPACE }}/fragalysis-backend:${{ env.GITHUB_REF_SLUG }}

  # Run the async API integration test (issue #964) against the freshly built
  # image. Only when the image was pushed, since the test stack pulls it by tag.
  integration-tests:
    needs: build
    if: needs.build.outputs.push == 'true'
    uses: ./.github/workflows/integration-tests.yaml
    with:
      be_namespace: ${{ needs.build.outputs.be_namespace }}
      be_image_tag: ${{ needs.build.outputs.tag }}
      unit_test_bucket_and_path: ${{ needs.build.outputs.unit_test_bucket_and_path }}
      unit_test_data_identifier: ${{ needs.build.outputs.unit_test_data_identifier }}
