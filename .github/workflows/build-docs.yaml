---
name: build docs

# Builds the Sphinx documentation (docs/source) on every push and pull
# request that touches the docs, the Python code they document, or the
# dependency definitions. The rendered HTML is uploaded as an artifact.
#
# Building the docs runs django.setup() (see docs/source/conf.py) and
# autodoc imports the 'viewer' app, so the 'main' dependencies are
# installed alongside the 'docs' group.

on:
  push:
    paths:
    - 'docs/**'
    - '**/*.py'
    - 'pyproject.toml'
    - 'poetry.lock'
    - '.github/workflows/build-docs.yaml'
    tags-ignore:
    - '**'
  pull_request:
    paths:
    - 'docs/**'
    - '**/*.py'
    - 'pyproject.toml'
    - 'poetry.lock'
    - '.github/workflows/build-docs.yaml'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install Poetry
      run: pipx install poetry
    - name: Install dependencies (main + docs)
      run: poetry install --only main,docs --no-root
    - name: Build docs
      # conf.py runs django.setup(), and the Django LOGGING config writes
      # to logs/backend.log - create the directory so the handler can open.
      run: |
        mkdir -p logs
        poetry run sphinx-build -b html docs/source docs/build/html
    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: docs/build/html
