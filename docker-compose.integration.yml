---
# A self-contained stack for the async API integration test (issue #964).
#
# Unlike docker-compose.yml (which runs Celery eagerly), this brings up a real
# broker (redis) and a celery_worker so an upload is processed asynchronously,
# exactly as in production. The `test` service drives the running `backend`
# purely over HTTP and polls task_status to SUCCESS.
#
# Run locally (after building the backend image, e.g. via the build-stack flow):
#
#   BE_NAMESPACE=xchem BE_IMAGE_TAG=latest \
#   UNIT_TEST_BUCKET_AND_PATH=s3://im-fragalysis-backend/unit-test \
#   UNIT_TEST_DATA_IDENTIFIER=ALPHA \
#   docker compose -f docker-compose.integration.yml up \
#     --abort-on-container-exit --exit-code-from test
#
# The download is anonymous, so no AWS credentials are needed.

# The backend and the worker share these settings - they must agree on the media
# storage (S3: there is no shared media volume, the tasks pass storage names to
# each other, issue 1038), the broker, the (disabled) upload authorisation, and
# the published TAS.
x-backend-environment: &backend-environment
  DEPLOYMENT_MODE: 'development'
  POSTGRESQL_USER: postgres
  CACHE_ENABLED: 'No'
  INFECTIONS: ''
  # Process uploads asynchronously via the worker, not eagerly.
  CELERY_TASK_ALWAYS_EAGER: 'False'
  CELERY_BROKER_URL: 'redis://redis:6379/0'
  CELERY_RESULT_BACKEND: 'redis://redis:6379/0'
  # The upload runs without a pre-existing proposal/membership ...
  AUTHENTICATE_UPLOAD: 'False'
  # ... and the loaded data is published so the anonymous GET/poll can see it.
  PUBLIC_TAS: ${PUBLIC_TAS:-lb32627-66}
  LOGGING_FRAMEWORK_ROOT_LEVEL: ${LOGGING_FRAMEWORK_ROOT_LEVEL:-INFO}
  PROXY_FORWARDED_PROTO_HEADER: http
  # The computed-set (RHS) upload needs a real logged-in user - the user id
  # becomes ComputedSet.owner_user - and authenticates over HTTP Basic as this
  # superuser, which launch-stack.sh creates on first boot. Pinned here rather
  # than left to launch-stack.sh's admin/UNSECURED fallback so the test and the
  # stack cannot drift apart.
  WEB_DJANGO_SUPERUSER_NAME: &superuser-name admin
  WEB_DJANGO_SUPERUSER_PASSWORD: &superuser-password UNSECURED
  WEB_DJANGO_SUPERUSER_EMAIL: admin@example.com
  # The media files are in the s3 service (SeaweedFS), see seaweedfs-s3.json.
  MEDIA_STORAGE: S3
  MEDIA_S3_BUCKET_NAME: fragalysis-media
  MEDIA_S3_ENDPOINT_URL: http://s3:8333
  MEDIA_S3_REGION_NAME: us-east-1
  MEDIA_S3_ACCESS_KEY_ID: fragalysis
  MEDIA_S3_SECRET_ACCESS_KEY: fragalysis-local-secret

services:

  database:
    extends:
      file: common-services.yml
      service: database
    # Override common-services' host bind mount with an ephemeral named volume,
    # so the test stack starts from a clean database every run (down -v wipes
    # it). An empty `volumes: []` does NOT clear an inherited bind mount - the
    # override must re-declare the same target path.
    volumes:
    - integration-db:/var/lib/postgresql/data

  redis:
    extends:
      file: common-services.yml
      service: redis
    volumes:
    - integration-redis:/data

  # The media files' object store, starting empty every run.
  s3:
    extends:
      file: common-services.yml
      service: s3
    volumes:
    - integration-s3:/data
    - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # The stack backend (gunicorn + nginx, listening on :80), with Celery
  # running for real against redis.
  backend:
    image: ${BE_NAMESPACE:-xchem}/fragalysis-backend:${BE_IMAGE_TAG:-latest}
    container_name: backend
    # Make the (empty) S3 store's media bucket first: the start-up check needs
    # it. (A one-shot service would stop the stack: see --abort-on-container-exit.)
    command: >-
      sh -c "python manage.py create_media_bucket --wait-s 120 &&
      /bin/bash /code/launch-stack.sh"
    environment: *backend-environment
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started
    healthcheck:
      # Ready once nginx is accepting connections on :80.
      test: python -c "import socket; socket.create_connection(('localhost', 80), 2).close()"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The asynchronous task processor (per docker-compose.celery.yml).
  celery_worker:
    image: ${BE_NAMESPACE:-xchem}/fragalysis-backend:${BE_IMAGE_TAG:-latest}
    container_name: celery_worker
    command: sh -c "celery -A fragalysis worker -l info"
    hostname: celery_worker
    environment: *backend-environment
    restart: on-failure
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # The test runner: drives the backend over HTTP and runs the integration test.
  # The production image carries only the 'main' dependencies, so install the
  # test toolchain (matching pyproject's test group) before running pytest.
  test:
    image: ${BE_NAMESPACE:-xchem}/fragalysis-backend:${BE_IMAGE_TAG:-latest}
    container_name: integration_test
    working_dir: /code
    # The two test files are listed LHS-first and pytest honours argument order:
    # the computed-set (RHS) upload resolves its ref_mols against site
    # observations the target load creates, so it cannot run before it.
    command: >-
      sh -c "pip install --quiet pytest pytest-django pytest-cov &&
      python -m pytest
      viewer/tests/test_api_upload_target_experiments_async.py
      viewer/tests/test_viewer_upload_cset_async.py
      -m integration --no-cov -p no:cacheprovider -v"
    environment:
      INTEGRATION_BASE_URL: 'http://backend:80'
      UNIT_TEST_BUCKET_AND_PATH: ${UNIT_TEST_BUCKET_AND_PATH}
      UNIT_TEST_DATA_IDENTIFIER: ${UNIT_TEST_DATA_IDENTIFIER}
      # Must match the backend's superuser - the RHS upload authenticates as it.
      WEB_DJANGO_SUPERUSER_NAME: *superuser-name
      WEB_DJANGO_SUPERUSER_PASSWORD: *superuser-password
      # pyproject points DJANGO_SETTINGS_MODULE at tests.test_settings, but the
      # top-level tests/ package is .dockerignore'd out of the image. The async
      # test is pure HTTP, but pytest still imports viewer/tests/conftest.py
      # (which imports Django models), so Django must be configured - use the
      # app's real settings module, which is present in the image.
      DJANGO_SETTINGS_MODULE: fragalysis.settings
    depends_on:
      backend:
        condition: service_healthy

volumes:
  integration-s3:
  integration-db:
  integration-redis:
