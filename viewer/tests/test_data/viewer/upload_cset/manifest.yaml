---
# Manifest for the upload_cset (RHS / computed set) external-data tests.
#
# Each top-level key is a UNIT_TEST_DATA_IDENTIFIER (selected via the env var of
# the same name). It names the SDF to upload through the real
# /viewer/upload_cset/ endpoint and the results to expect afterwards.
#
# The objects live in the public-read bucket under
#   <UNIT_TEST_BUCKET_AND_PATH>/viewer/upload_cset/<IDENTIFIER>/<file>
# i.e. the SAME flat layout as the LHS manifest, under the SAME identifier.
#
# RHS data is NOT independent of LHS data. viewer/cset_upload.py resolves each
# molecule's `ref_mols` to a SiteObservation.code *for that target*, and those
# short codes ("A71EV2A-x0152b") are generated by the target load - so an SDF is
# only valid against one specific LHS load. That is why the RHS file lives under
# the LHS identifier rather than getting an identifier of its own, and why the
# test asserts up front that the LHS target is present.
#
# Each `uploads` entry carries:
#   tas    - the proposal_ref, which must match the LHS Project.title.
#   target - the target_name, which must match the LHS target_title.
#   file   - the object name under the identifier directory. The filename must
#            start "compound-set_" and end ".sdf" (see viewer/sdf_check.py).
#
# `expect` drives the assertions. Counts are only asserted when non-null, so a
# new identifier can start with placeholders and gain assertions as the real
# numbers are filled in - the test warns with the observed count meanwhile.
#
# NOTE on `objects.compound_sets`: do NOT pin the ComputedSet `name`. It is
# generated as "<method>-<upload date>-A" (cset_upload.py), so it changes every
# day. Pin `method` and `spec_version`, which come from the SDF's blank mol and
# are stable.

ALPHA:
  uploads:
    - tas: lb32627-66
      target: A71EV2A
      file: compound-set_A71EV2A.sdf
  expect:
    # ComputedSets visible at /api/compound-sets/ after the upload.
    compound_sets: 1
    # Molecules in the SDF (excluding the blank/description mol). Each becomes a
    # ComputedMolecule and a *virtual* SiteObservation, so this is also how much
    # /api/site_observations/ grows by - which the test checks against the LHS
    # count it observed before uploading.
    computed_molecules: 67
    objects:
      compound_sets:
        - method: A71EV2A_test_rhs
          spec_version: 1.2
